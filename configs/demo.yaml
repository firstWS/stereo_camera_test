# 데모용: 프레임 수 축소, YOLO 검출(Ultralytics 필요).
# 보정 파일은 setup.ps1 또는 scripts/create_placeholder_calibration.py 로 생성합니다.

camera:
  device_index: 0
  width: 3200
  height: 1200
  fps: 60
  backend: null

sbs:
  left_width: null
  swap_eyes: false

calibration:
  yaml: calibration/stereo_calib.yaml
  maps_npy_prefix: calibration/rectify_maps

sgbm:
  min_disparity: 0
  num_disparities: 128
  block_size: 5
  disp12_max_diff: 1
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 32
  scale_down: 2

sparse:
  template_radius: 7
  max_disparity: 128
  min_disparity: 1

detector:
  kind: yolo
  model_path: yolo11s.pt
  conf: 0.9
  iou: 0.45
  imgsz: 640
  device: null

apriltag_scale:
  enabled: false
  dictionary: APRILTAG_36H11
  known_spacing_m: 1.0
  tag_id_a: null
  tag_id_b: null
  sample_radius: 2
  min_disp: 1.0
  draw: true
  apply_scale_to_depth: true

repeatability:
  max_frames: 4000
  output_csv: out/repeatability_demo.csv
  warmup_frames: 5
  log_all_boxes: true
  max_boxes_per_frame: 64

input:
  type: camera
  video_path: null

# 미리보기: scale 은 표시 배율(0.5=창 절반). Q=종료, S=좌/우 한 쌍 PNG(image_folder 재실행용).
preview:
  enabled: true
  scale: 0.5
  window_autosize: true
  wait_key_ms: 33
  snapshot_dir: out/snapshots
  disparity_percentile_smooth_alpha: 0.18
  stack_disparity_below: false
  combined_side_by_side_stereo: false
  windows:
    combined: true
    disparity: true
  titles:
    merged: "stereo-3d-poc | left RGB + disparity"
    combined: "stereo-3d-poc | left RGB"
    disparity: "stereo-3d-poc | disparity"
