# 카메라 없이 좌/우 이미지 폴더로 파이프라인 테스트.
# samples/stereo_pairs/left 와 right 에 동일 파일명의 쌍을 넣으세요.

camera:
  device_index: 0
  width: 3200
  height: 1200
  fps: 60
  backend: null

sbs:
  left_width: null
  swap_eyes: false

calibration:
  yaml: calibration/stereo_calib.yaml
  maps_npy_prefix: calibration/rectify_maps

sgbm:
  min_disparity: 0
  num_disparities: 128
  block_size: 5
  disp12_max_diff: 1
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 32
  scale_down: 2

sparse:
  template_radius: 7
  max_disparity: 128
  min_disparity: 1

detector:
  kind: dummy
  frac: 0.2

apriltag_scale:
  enabled: false
  dictionary: APRILTAG_36H11
  known_spacing_m: 1.0
  tag_id_a: null
  tag_id_b: null
  sample_radius: 2
  min_disp: 1.0
  draw: true
  apply_scale_to_depth: true

repeatability:
  max_frames: 5000
  output_csv: out/repeatability_from_images.csv
  warmup_frames: 0
  log_all_boxes: true
  max_boxes_per_frame: 64

input:
  type: image_folder
  video_path: null
  image_folder:
    left_dir: samples/stereo_pairs/left
    right_dir: samples/stereo_pairs/right
    patterns:
      - "*.png"
      - "*.jpg"
      - "*.jpeg"

preview:
  enabled: true
  scale: 0.5
  window_autosize: true
  wait_key_ms: 100
  snapshot_dir: out/snapshots
  # 한 장만 넣어도 창 유지; 다음 쌍: Space 또는 n, 종료: Q
  image_folder_hold_until_quit: true
  image_folder_hold_poll_ms: 50
  disparity_percentile_smooth_alpha: 0.18
  stack_disparity_below: false
  combined_side_by_side_stereo: false
  windows:
    combined: true
    disparity: true
